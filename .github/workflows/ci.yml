name: CI

on:
  push:
    branches: [main]
  # No `branches` filter — stacked PRs target the previous milestone branch, not only main.
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      # next build generates next-env.d.ts (gitignored) and typechecks the app.
      # Explicit tsc follows so `npm run typecheck` is gated the same way locally.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
