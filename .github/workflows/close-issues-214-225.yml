# One-shot: Cursor's git token can push but cannot write issues.
# Actions GITHUB_TOKEN (issues: write) closes #214–#225 with the main SHAs.
# Delete this workflow after the comments land.
name: Close issues #214–#225

on:
  push:
    branches: [main]

permissions:
  issues: write
  contents: read

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close #214–#225
        uses: actions/github-script@v7
        with:
          script: |
            const items = [
              {
                number: 214,
                sha: 'a1e552745472a68ff9918136727aff75fa4f8cf5',
                body: 'Fixed in a1e552745472a68ff9918136727aff75fa4f8cf5 (atomic delete_party) and 18ffa95c4b600894a3ebf190bd2cd8c9a68f8313 (Neon types). DELETE /api/admin/trips/{slug} removes the party, guests, and versions together so guests are never wiped if the party survives.',
              },
              {
                number: 215,
                sha: 'eedd57bbe792bf030f7ba24945db942e652c971c',
                body: 'Fixed in eedd57bbe792bf030f7ba24945db942e652c971c. Plan ingest returns 503 before the function maxDuration so a slow model cannot drop the TCP connection.',
              },
              {
                number: 216,
                sha: '3d37820cfa590a97fe3e8ca76c58bd66726f1278',
                body: 'Fixed in 3d37820cfa590a97fe3e8ca76c58bd66726f1278 (preserve plus-one on Yes→Maybe) and 29c412bbdd2666ab2842a802de00ee24afb1ca42 (summary partySize). Omitted plus-one name and party size keep stored values.',
              },
              {
                number: 217,
                sha: 'f465d95233b65c3ce35369aafada18f2eb004dd6',
                body: 'Fixed in f465d95233b65c3ce35369aafada18f2eb004dd6. Getting there lodging copy uses the same per-person cost note as At a glance.',
              },
              {
                number: 218,
                sha: '6ce7776764d75f12ad346194dc10f57f43e6e8ba',
                body: 'Fixed in 6ce7776764d75f12ad346194dc10f57f43e6e8ba. After a successful RSVP save, further edits reset the button from Saved to Save and dismiss the confirmation alert.',
              },
              {
                number: 219,
                sha: '6a40878cf229306f6e6f9278d42c7762dc4858f2',
                body: 'Fixed in 6a40878cf229306f6e6f9278d42c7762dc4858f2. Day 01 / N key events keep spaces, clocks go through formatClockTime, and every entry shows its saved time.',
              },
              {
                number: 220,
                sha: '27a72cd26fc6d1e8f2b7ba68685f551d55d9e626',
                body: 'Fixed in 27a72cd26fc6d1e8f2b7ba68685f551d55d9e626. Draft facts only show “stays TBD” when the value is missing; extracted location/lodging get a confirm-nudge.',
              },
              {
                number: 221,
                sha: '8e5307c5f3d573660ccc875101cd01dc9cc493c9',
                body: 'Fixed in 8e5307c5f3d573660ccc875101cd01dc9cc493c9. Roster cards expose “Muse, Yes” (with a visible · separator) instead of concatenating MuseYes.',
              },
              {
                number: 222,
                sha: 'd1ac3f4ae16f4d496a90b90f120fc53d51063315',
                body: 'Fixed in d1ac3f4ae16f4d496a90b90f120fc53d51063315. Provider timeouts and unparseable notes return distinct 503 copy; unlabeled dumps tell the host to use Label: value lines instead of promising a retry in a minute.',
              },
              {
                number: 223,
                sha: '994c56371cbdb679fe66297e1f9639d8bf8a8786',
                body: 'Fixed in 994c56371cbdb679fe66297e1f9639d8bf8a8786. Host key banner is hidden by default; Show host key reveals it for the tab.',
              },
              {
                number: 224,
                sha: 'a30f91defc03597abde147ebd0d3e12ab4c9a33e',
                body: 'Fixed in a30f91defc03597abde147ebd0d3e12ab4c9a33e. bigsend create and MCP create redact adminToken/password by default; --json / --show-secrets keep the full packet for automation.',
              },
              {
                number: 225,
                sha: '7b6a060f2a87110046e2aa2ae6539e1a88040300',
                body: 'Fixed in 7b6a060f2a87110046e2aa2ae6539e1a88040300. Untimed schedule entries render as Step N instead of 01/02 that look like broken clock times.',
              },
            ];

            for (const item of items) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                per_page: 100,
              });
              if (!comments.some((c) => (c.body || '').includes(item.sha))) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item.number,
                  body: item.body,
                });
              }
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                state: 'closed',
              });
              console.log(`Closed #${item.number}`);
            }
