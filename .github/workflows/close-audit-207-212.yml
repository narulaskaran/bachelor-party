# One-shot: Cursor's git token can push but cannot write issues.
# Actions GITHUB_TOKEN (issues: write) closes #207–#212 with the main SHAs.
# Delete this workflow after the comments land.
name: Close audit issues #207–#212

on:
  push:
    branches: [main]

permissions:
  issues: write
  contents: read

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close #207–#212
        uses: actions/github-script@v7
        with:
          script: |
            const items = [
              {
                number: 207,
                sha: '105067fe9c5ec3d2d327e89da8d6a566e6c617c5',
                body: 'Fixed in 105067fe9c5ec3d2d327e89da8d6a566e6c617c5. getDb() reuses one Neon HTTP + drizzle client per process (keyed by DATABASE_URL).',
              },
              {
                number: 208,
                sha: 'f5e7c141081e41bf44c67f3b7c290b149b2d08e7',
                body: 'Fixed in f5e7c141081e41bf44c67f3b7c290b149b2d08e7. Guest invite/RSVP party lookups are request-scoped: proxy uses meta-only columns; RSC layout/page/RSVP share one token resolve; getGuests + getRsvpPrefill no longer re-resolve the same token.',
              },
              {
                number: 209,
                sha: '31e13c1033aa109239ccf40e2e8e78571cede83f',
                body: "Fixed in 31e13c1033aa109239ccf40e2e8e78571cede83f. PLAN_EXTRACT_TIMEOUT_MS is 25s; OpenRouter extract uses maxRetries: 0. Create error copy unchanged.",
              },
              {
                number: 210,
                sha: '56e0e76d203aa7fb07e4355e62855a6c74a0e6e3',
                body: 'Fixed in 56e0e76d203aa7fb07e4355e62855a6c74a0e6e3 (types 0241d90ecd7d0d05761d822d469f8bd9393f7c0d). Admin/API list uses count() instead of selecting guest rows; authorizePartyBySlug and cookie fallbacks skip full jsonb unless GET/PATCH need content.',
              },
              {
                number: 211,
                sha: '61e96e772c76f9dc55d09e7d1b207f547fdf22a8',
                body: 'Fixed in 61e96e772c76f9dc55d09e7d1b207f547fdf22a8 (after 53ccc26de1f3f2c5505fa7cca34a1375067611d7). shadcn is a devDependency only so @import "shadcn/tailwind.css" still resolves at next build; not a production runtime dep. components.json kept. CI green.',
              },
              {
                number: 212,
                sha: '17fc232fe688bef8c85ae5ed02aefff59a776363',
                body: 'Fixed in 17fc232fe688bef8c85ae5ed02aefff59a776363. content_versions skips identical consecutive snapshots, keeps the newest 20 drafts plus all published (storage/retention only; no host history UI). Full snapshots remain on retained rows so GET /versions is unchanged.',
              },
            ];

            for (const item of items) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                per_page: 100,
              });
              if (!comments.some((c) => (c.body || '').includes(item.sha))) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item.number,
                  body: item.body,
                });
              }
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                state: 'closed',
              });
              console.log(`Closed #${item.number}`);
            }
