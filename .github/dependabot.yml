version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    groups:
      next-toolchain:
        patterns:
          - next
          - eslint-config-next
          - "@next/*"

      drizzle:
        patterns:
          - drizzle-orm
          - drizzle-kit
          - "@neondatabase/*"

      testing:
        patterns:
          - vitest
          - "@vitest/*"
